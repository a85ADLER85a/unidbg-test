name: Run Unidbg Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Compile and Run Unidbg
      run: |
        mvn clean compile
        mvn exec:java -Dexec.mainClass="ir.avanegar.dumper.Main" > analysis_log.txt
        
    - name: Upload Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unidbg-logs
        path: analysis_log.txt

